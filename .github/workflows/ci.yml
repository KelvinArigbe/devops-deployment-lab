name: Build and test webpage

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t kelvin-web:ci .

      - name: Start test container
        run: |
          docker run -d --name webpage-test \
            -p 127.0.0.1:8080:80 kelvin-web:ci

      - name: Check webpage responds with expected content
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            --max-time 5 \
            http://127.0.0.1:8080 > response.html

          grep -Fq "My first custom deployment" response.html
          grep -Fq "Version: 3.0" response.html
          echo "Webpage checks passed"

      - name: Show container logs
        if: always()
        run: docker logs webpage-test

      - name: Remove test container
        if: always()
        run: docker rm -f webpage-test
